<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, rgb(34, 193, 195), rgb(253, 187, 45));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: rgb(255, 255, 255);
            font-size: 50px;
            text-align: center;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin: 0;
        }
        .container {
            display: flex;
            flex-wrap: nowrap;
            gap: 80px;
            justify-content: center;
            max-width: 1200px;
            padding: 40px 0;
        }
        .card {
            background: rgb(248, 133, 98);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 350px;
            font-size: 24px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }
        .card:active {
            transform: scale(0.95);
        }
        @media (max-width: 1024px) {
            .container {
                flex-wrap: wrap;
            }
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .card {
                width: 90%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <h1>My Projects works</h1>
    <div class="container">
        <div class="card" onclick="window.location.href='https://vinayraiti.github.io/game/';">
            <img src="https://designshack.net/wp-content/uploads/Game-Shop-Games-Store-App-Logo-Template-1.webp" alt="Gaming">
            HTML Gaming Work
        </div>
        <div class="card" onclick="window.location.href='https://vinayraiti.github.io/bank-work/';">
            <img src="https://st4.depositphotos.com/16255066/31001/v/450/depositphotos_310012938-stock-illustration-vector-logo-for-online-bank.jpg" alt="Banking">
            Banking Work
        </div>
        <div class="card" onclick="window.location.href='https://vinayraiti.github.io/works-shop/';">
            <img src="https://img.freepik.com/premium-vector/free-vector-dark-blue-orange-online-shop-logo_883906-585.jpg?semt=ais_hybrid" alt="Shopping">
            Shopping Work
        </div>
    </div>
</body>
</html>
